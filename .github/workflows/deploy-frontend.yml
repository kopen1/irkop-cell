name: Frontend CI

# Deploy frontend sekarang ditangani langsung oleh Cloudflare Pages
# GitHub integration (project 'konter' terhubung ke repo ini, branch main).
# Workflow ini hanya menjalankan tes sebagai sanity-check CI; tidak lagi
# upload via wrangler (hindari dobel-deploy).

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        run: |
          cd frontend
          npm ci
      - name: Run Tests
        continue-on-error: true
        run: |
          cd frontend
          npm test
