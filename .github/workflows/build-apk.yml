name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'frontend/src/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        env:
          VITE_API_BASE: /api
        run: |
          cd frontend
          npm run build

      - name: Setup Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: Init Capacitor (if needed)
        run: |
          cd mobile
          if [ ! -d "android" ]; then
            npx cap init "Iirkop Cell" "id.co.irkop.cell" --web-dir "../frontend/dist"
            npx cap add android
          fi

      - name: Sync Capacitor
        run: |
          cd mobile
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd mobile/android
          ./gradlew assembleDebug

      - name: Check Build Output
        if: always()
        run: |
          echo "=== Build output ==="
          find mobile/android -name "*.apk" -type f 2>/dev/null || echo "No APK found"

      - name: Upload APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: konter-debug.apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
