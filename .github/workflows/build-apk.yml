name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'frontend/src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        env:
          VITE_API_BASE: /api
        run: |
          cd frontend
          npm run build

      - name: Setup Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: Init Capacitor (if needed)
        run: |
          cd mobile
          if [ ! -d "android" ]; then
            npx cap init "Irkop Cell" "id.co.irkop.cell" --web-dir "../frontend/dist"
            npx cap add android
          fi

      - name: Sync Capacitor
        run: |
          cd mobile
          npx cap sync android

      - name: Cache Debug Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Prepare Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set APK Version
        run: |
          cd mobile/android
          sed -i "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/" app/build.gradle
          sed -i "s/versionName \"1.0\"$/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" app/build.gradle

      - name: Build APK
        run: |
          cd mobile/android
          ./gradlew assembleDebug

      - name: Check Build Output
        if: always()
        run: |
          echo "=== Build output ==="
          find mobile/android -name "*.apk" -type f 2>/dev/null || echo "No APK found"

      - name: Upload APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: konter-debug.apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          TAG="apk-v${VERSION}-${GITHUB_RUN_ATTEMPT}"
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk irkop-cell.apk
          gh release create "$TAG" irkop-cell.apk \
            --title "APK Irkop Cell v${VERSION}" \
            --notes "APK terbaru Irkop Cell (build ${GITHUB_RUN_NUMBER}). Download langsung tanpa login." \
            --latest
