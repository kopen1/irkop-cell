name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'frontend/src/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        env:
          VITE_API_BASE: /api
        run: |
          cd frontend
          npm run build

      - name: Setup Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: Init Capacitor (if needed)
        run: |
          cd mobile
          if [ ! -d "android" ]; then
            npx cap init "Iirkop Cell" "id.co.irkop.cell" --web-dir "../frontend/dist"
            npx cap add android
          fi

      - name: Sync Capacitor
        run: |
          cd mobile
          npx cap sync android

      - name: Decode Keystore (after android/ exists)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p mobile/android/app
          echo "$KEYSTORE_BASE64" | base64 -d > mobile/android/app/konter-release.keystore

      - name: Configure Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd mobile/android
          cat >> app/build.gradle << 'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file("konter-release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                      keyAlias System.getenv("KEY_ALIAS") ?: ""
                      keyPassword System.getenv("KEY_PASSWORD") ?: ""
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd mobile/android
          ./gradlew assembleRelease

      - name: Check Build Output
        if: always()
        run: |
          echo "=== Build output ==="
          find mobile/android -name "*.apk" -type f 2>/dev/null || echo "No APK found"

      - name: Upload APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: konter-release.apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Cleanup Keystore
        if: always()
        run: rm -f mobile/android/app/konter-release.keystore
